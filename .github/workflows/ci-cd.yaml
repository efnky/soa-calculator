name: CI-CD Calculator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compilation, tests et Docker
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupération du code source
      - name: Récupération du code source
        uses: actions/checkout@v7

      # Étape 2 : Installation de Java 21
      - name: Installation de Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Étape 3 : Compilation et tests Maven
      - name: Compilation et tests Maven
        run: mvn -B -ntp clean verify

      # Étape 4 : Vérification du JAR
      - name: Vérification du JAR
        run: |
          ls -lh target/
          test -f target/calculator-1.0-SNAPSHOT.jar

      # Étape 5 : Sauvegarde du JAR
      - name: Sauvegarde du JAR
        uses: actions/upload-artifact@v4
        with:
          name: calculator-jar
          path: target/calculator-1.0-SNAPSHOT.jar
          if-no-files-found: error

      # Étape 6 : Construction de l'image Docker
      - name: Construction de l'image Docker
        run: docker build -t calculator:1.0 .

      # Étape 7 : Démarrage du conteneur Docker
      - name: Démarrage du conteneur Docker
        run: |
          docker run -d \
            --name calculator-ci \
            -p 8089:8089 \
            calculator:1.0

      # Étape 8 : Vérification du service SOAP
      - name: Vérification du service SOAP
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:8089/?wsdl" -o /tmp/calculator.wsdl \
              && grep -qi "definitions" /tmp/calculator.wsdl; then
              echo "Service SOAP accessible"
              exit 0
            fi
            sleep 2
          done
          echo "Service SOAP inaccessible"
          docker logs calculator-ci
          exit 1

      # Étape 9 : Arrêt du conteneur
      - name: Arrêt du conteneur
        if: always()
        run: docker rm -f calculator-ci || true
